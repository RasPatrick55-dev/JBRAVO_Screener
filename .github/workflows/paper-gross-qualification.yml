name: Paper gross native qualification one-use

# Publishing the reviewed two-file commit is the single authorized admission.
# Subsequent pushes, branch rewinds and job reruns are not permitted by this packet.
on:
  push:
    branches: [repair/paper-gross-performance-20261023]
    paths:
      - .github/workflows/paper-gross-qualification.yml
      - tests/native_paper_gross_qualification.py

permissions:
  contents: read

concurrency:
  group: paper-gross-native-one-use-f69a7fdc
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.repository == 'RasPatrick55-dev/JBRAVO_Screener' &&
      github.event.before == 'f69a7fdcfdc36416aa46c9c445212c6678a8da94' &&
      github.run_attempt == 1 && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:12.2
        env:
          POSTGRES_USER: qualification_admin
          POSTGRES_PASSWORD: EPHEMERAL_QUALIFICATION_ONLY_745
          POSTGRES_DB: qualification_745
        ports: ['55432:5432']
        options: >-
          --cpus 2 --memory 1g
          --health-cmd "pg_isready -U qualification_admin -d qualification_745"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUALIFICATION_ADMISSION: PR745_NATIVE_PREP005_06832BA6
      APCA_API_BASE_URL: https://paper-api.alpaca.markets
      APCA_DATA_API_BASE_URL: https://data.alpaca.markets
      ALPACA_DATA_FEED: iex
      APCA_API_KEY_ID: DUMMY_CI_KEY
      APCA_API_SECRET_KEY: DUMMY_CI_SECRET
      JBR_EXEC_PAPER: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qualification
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 06832ba6ede6d0519c89cdbaa8912b55b9df792f
          path: app
          persist-credentials: false
      - name: Verify exact application and two-file test-only commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 06832ba6ede6d0519c89cdbaa8912b55b9df792f
          test "$(git -C qualification rev-parse HEAD^)" = f69a7fdcfdc36416aa46c9c445212c6678a8da94
          git -C qualification diff --name-only HEAD^ HEAD | sort > actual-paths
          printf '%s\n' .github/workflows/paper-gross-qualification.yml tests/native_paper_gross_qualification.py | sort > expected-paths
          diff -u expected-paths actual-paths
          echo '4429ea787378172d7ac64cb474db24cb7d5c1f5067204e63be2ce0c23bcab73c  qualification/tests/native_paper_gross_qualification.py' | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install isolated runner dependencies
        run: python -m pip install -r app/requirements.txt pytest
      - name: Run native synthetic qualification once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-output/tmp qualification-output/cache qualification-output/mpl
          touch qualification-output/empty-passfile qualification-output/empty-service
          export TMPDIR="$GITHUB_WORKSPACE/qualification-output/tmp"
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/qualification-output/cache"
          export MPLCONFIGDIR="$GITHUB_WORKSPACE/qualification-output/mpl"
          export PGPASSFILE="$GITHUB_WORKSPACE/qualification-output/empty-passfile"
          export PGSERVICEFILE="$GITHUB_WORKSPACE/qualification-output/empty-service"
          timeout --signal=TERM --kill-after=10s 300s python -I -B qualification/tests/native_paper_gross_qualification.py --source-root "$GITHUB_WORKSPACE/app"
      - name: Preserve bounded nonsecret qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-gross-native-${{ github.run_id }}
          path: qualification-output/*-result.json
          if-no-files-found: warn
          retention-days: 7
